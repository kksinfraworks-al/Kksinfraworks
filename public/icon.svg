<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d97706;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b45309;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#334155;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="100" fill="url(#metal)" />
  <rect x="16" y="16" width="480" height="480" rx="84" fill="none" stroke="#d97706" stroke-width="8" stroke-dasharray="24 16" opacity="0.4" />
  
  <!-- Construction Crane / Scaffolding Element -->
  <path d="M120 400 L120 180 L280 180 L390 100" fill="none" stroke="#f59e0b" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M120 230 L170 180 M120 280 L220 180 M120 330 L270 180 M120 380 L320 180" fill="none" stroke="#fbbf24" stroke-width="6" opacity="0.6" />
  <path d="M280 180 L280 250" fill="none" stroke="#f59e0b" stroke-width="8" stroke-dasharray="10 8" />
  <rect x="260" y="250" width="40" height="30" rx="6" fill="#f59e0b" />
  
  <!-- Hardhat / Helmet -->
  <path d="M180 340 C180 260 340 260 340 340 Z" fill="url(#grad)" stroke="#fed7aa" stroke-width="8" />
  <path d="M150 340 L370 340 C380 340 380 360 370 360 L150 360 C140 360 140 340 150 340 Z" fill="#d97706" />
  <rect x="250" y="270" width="20" height="70" rx="6" fill="#fbbf24" opacity="0.8" />
  
  <!-- Monogram text KKS -->
  <text x="256" y="445" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="#f8fafc" text-anchor="middle" letter-spacing="4">KKS INFRA</text>
  <text x="256" y="475" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#f59e0b" text-anchor="middle" letter-spacing="2">CONSTRUCTION • ESTD 2002</text>
</svg>
